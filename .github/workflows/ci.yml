name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'vpslink.sh'
      - 'tests/**'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Syntax and ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show shellcheck version
        run: shellcheck --version

      - name: Bash syntax check
        run: bash -n vpslink.sh

      - name: ShellCheck
        run: shellcheck --severity=style vpslink.sh
